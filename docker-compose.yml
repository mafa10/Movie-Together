services:
  db:
    image: postgres:16
    container_name: movie-together-db
    environment:
      POSTGRES_DB: movietogether
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: movie-together-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/movietogether
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      TMDB_API_KEY: ${TMDB_API_KEY}
      TMDB_API_BASE_URL: https://api.themoviedb.org/3
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: movie-together-frontend
    ports:
      - "3000:80"
    depends_on:
      - app

volumes:
  postgres_data: